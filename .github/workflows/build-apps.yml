name: Build Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/core/package-lock.json
            desktop/package-lock.json

      # `npm ci` installiert exakt die Versionen aus den Lockfiles.
      - name: Install core dependencies
        working-directory: desktop/core
        run: npm ci

      - name: Typecheck core
        working-directory: desktop/core
        run: npm run typecheck

      - name: Test core
        if: runner.os == 'Linux'
        working-directory: desktop/core
        run: npm test

      - name: Build core
        working-directory: desktop/core
        run: npm run build

      # Nur Produktions-Abhängigkeiten werden in die App gepackt.
      - name: Prune core dev dependencies
        working-directory: desktop/core
        run: npm prune --omit=dev

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Der Standardwert "tools platform-tools" scheitert, weil das Paket
      # "tools" nicht mehr existiert. Lizenzen akzeptiert die Action selbst.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Android debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

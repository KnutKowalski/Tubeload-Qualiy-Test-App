name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Typecheck + Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/core/package-lock.json

      - name: Install
        working-directory: desktop/core
        run: npm ci

      - name: Typecheck
        working-directory: desktop/core
        run: npm run typecheck

      - name: Test
        working-directory: desktop/core
        run: npm test

      - name: Build
        working-directory: desktop/core
        run: npm run build

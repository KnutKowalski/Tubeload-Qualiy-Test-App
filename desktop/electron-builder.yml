appId: dev.tubeload.qa
productName: TubeLoad QA
copyright: Copyright © 2026 TubeLoad QA

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json

extraResources:
  - from: core
    to: core
    filter:
      - dist/**/*
      - public/**/*
      - node_modules/**/*
      - package.json

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  target:
    - AppImage
    - deb
  category: Development

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TubeLoad QA</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 16px;
      background: #111;
      color: #eee;
    }

    h1, h2, h3 {
      margin: 10px 0;
    }

    input, select, button, textarea {
      padding: 7px 9px;
      margin: 3px;
      background: #1d1d1d;
      color: #eee;
      border: 1px solid #333;
      border-radius: 6px;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #282828;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .card {
      background: #181818;
      border: 1px solid #333;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .card b {
      font-size: 20px;
    }

    canvas {
      background: #151515;
      border: 1px solid #333;
      width: 100%;
      height: 180px;
      border-radius: 10px;
      margin: 10px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid #2a2a2a;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #aaa;
      font-weight: 600;
    }

    .muted {
      color: #888;
    }

    #msg {
      min-height: 1.2em;
      color: #8ff;
      margin: 6px 0;
    }

    .danger {
      color: #f88;
    }
  </style>
</head>
<body>
  <h1>TubeLoad QA</h1>
  <div class="muted">
    Netzwerk-/Streaming-Qualitätstest mit Playwright-Chromium. Nur für legitime QA-Zwecke verwenden.
  </div>

  <h2>Session starten</h2>

  <form id="sessionForm" class="row">
    <input
      name="url"
      placeholder="YouTube Video-, Playlist- oder Kanal-URL"
      size="78"
      required
    />

    <select id="recentUrls" title="Zuletzt verwendete URLs">
      <option value="">Letzte URLs…</option>
    </select>

    <select name="kind">
      <option value="auto">auto erkennen</option>
      <option value="video">Video</option>
      <option value="playlist">Playlist</option>
      <option value="channel">Kanal</option>
    </select>

    <select name="quality">
      <option value="auto">auto</option>
      <option value="480p">480p</option>
      <option value="720p">720p</option>
      <option value="1080p">1080p</option>
      <option value="1440p">1440p</option>
      <option value="2160p">2160p</option>
    </select>
